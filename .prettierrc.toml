singleQuote   = true
trailingComma = "all"
proseWrap     = "always"
# Canonical is 100. Kept at 120 to match the existing content and .markdownlint.jsonc MD013 (120).
printWidth    = 120
endOfLine     = "lf"
tabWidth      = 2
plugins       = ["prettier-plugin-go-template"]

[[overrides]]
files = ["layouts/**/*.html"]

[overrides.options]
parser = "go-template"
